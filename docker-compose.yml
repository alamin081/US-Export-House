# Local development database only. Staging and production use a managed
# PostgreSQL (Neon or Supabase, Singapore region - open question 10).
services:
  postgres:
    image: postgres:17-alpine
    container_name: use_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-use_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-use_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-us_export_house}
      # Deterministic collation so ordering matches the managed databases.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-use_admin} -d ${POSTGRES_DB:-us_export_house}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: use_postgres_data
