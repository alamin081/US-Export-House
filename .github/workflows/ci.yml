name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      # Dummy values: CI only needs the shape to be valid, never real secrets.
      APP_ENV: local
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: US Export House
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/us_export_house?schema=public
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-32
      SMS_PROVIDER: dev
      PAYMENT_SSLCOMMERZ_MODE: disabled
      COURIER_STEADFAST_MODE: mock
      STORAGE_PROVIDER: local
      USE_MOCK_STOREFRONT_DATA: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  database:
    name: Migrate and seed a clean database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: use_admin
          POSTGRES_PASSWORD: use_dev_password
          POSTGRES_DB: us_export_house
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U use_admin -d us_export_house"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: US Export House
      DATABASE_URL: postgresql://use_admin:use_dev_password@localhost:5432/us_export_house?schema=public
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-32
      SMS_PROVIDER: dev
      PAYMENT_SSLCOMMERZ_MODE: disabled
      COURIER_STEADFAST_MODE: mock
      STORAGE_PROVIDER: local
      USE_MOCK_STOREFRONT_DATA: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Proves the migrations apply to an empty database, that the seed runs,
      # and that every database guard rail rejects invalid data.
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run db:verify
